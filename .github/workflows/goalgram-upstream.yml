name: Watch Telegram releases
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-release-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const current = JSON.parse(fs.readFileSync('.goalgram/source-lock.json')).tag;
            const tags = await github.paginate(github.rest.repos.listTags, {owner:'TelegramMessenger',repo:'Telegram-iOS',per_page:100});
            const version = t => t.replace('release-','').split('.').map(Number);
            const compare = (a,b) => { const x=version(a),y=version(b); for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0);} return 0; };
            const latest = tags.map(t=>t.name).filter(t=>/^release-\d+\.\d+(\.\d+)?$/.test(t)).sort(compare).pop();
            if (!latest || compare(latest,current)<=0) { core.info(`Up to date: ${current}`); return; }
            const title = `Telegram update: ${latest}`;
            const issues = await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'all',creator:'github-actions[bot]',per_page:100});
            if (issues.some(i=>i.title===title)) return;
            await github.rest.issues.create({...context.repo,title,body:`@mylyne Official upstream released [${latest}](https://github.com/TelegramMessenger/Telegram-iOS/releases/tag/${latest}). Goalgram currently uses ${current}.\n\nThe local Mac updater will merge into an isolated branch, build and validate, then publish to TestFlight only after checks pass. Conflicts or validation failures stop publication. The Mac must be awake, online and logged in. No signing secrets are stored in this repository.`});
